
# ============================================================
# AI 漫剧工作流 — Nginx 反向代理配置（公网部署专用）
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ai-manga.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 替换下方 server_name 为你的域名或公网 IP
# ============================================================

# 上游后端
upstream ai_manga_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket 升级标志
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 把下方 _ 换成你的域名，例如：example.com www.example.com
    # 如果只用 IP 访问，保留 _ （匹配所有）
    server_name _;

    # 上传大文件 (PDF / 漫画包)
    client_max_body_size 1024m;
    client_body_timeout 300s;
    send_timeout 300s;

    # ---------- 前端静态资源 ----------
    root /opt/ai-manga/frontend/dist;
    index index.html;

    # 静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 REST API ----------
    location /api/ {
        proxy_pass http://ai_manga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- WebSocket（任务进度 / ComfyUI 事件） ----------
    location /api/jobs/ws/ {
        proxy_pass http://ai_manga_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------- 生成的产物 / 上传文件 ----------
    location /static/ {
        proxy_pass http://ai_manga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 大视频流式传输
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---------- 健康检查 ----------
    location = /health {
        proxy_pass http://ai_manga_backend;
    }
}

# ============================================================
# HTTPS 版本（可选，推荐用 Let's Encrypt / certbot 自动签发）
# 启用方式：
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d your-domain.com
# certbot 会自动修改本文件补全 443 配置块
# ============================================================
